[package]
name = "webgme-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "WebGME related Rust components compiled to WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sha1 = "0.11"
wasm-bindgen = "0.2.128"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# wasm-pack 0.15 ships Binaryen 117, which rejects bulk-memory unless it is enabled.
# Rust 1.82+ emits that feature by default for wasm32-unknown-unknown.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-O",
    "--enable-bulk-memory",
    "--enable-multivalue",
    "--enable-mutable-globals",
    "--enable-nontrapping-float-to-int",
    "--enable-reference-types",
    "--enable-sign-ext",
]
